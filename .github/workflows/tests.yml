name: self-checks

# The suite needs numpy and torch only. It does not need a PlutoSDR, it does not
# need Qt, and it does not need libiio: tests/_support.py replaces those three when
# they are absent. Thus the checks run on a plain runner.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  self-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install numpy and CPU torch
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run the self-checks
        run: python tests/run_all.py
